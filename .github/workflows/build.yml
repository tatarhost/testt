name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MinecraftMAXHost app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftMAXHost-Windows
          path: dist/MinecraftMAXHost.exe
          if-no-files-found: error
          retention-days: 30
